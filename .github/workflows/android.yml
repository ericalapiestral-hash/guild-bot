name: 안드로이드 APK 빌드

# APK는 여기서 만들어 Actions 아티팩트로 받는다.
# (로컬에 Android SDK를 깔지 않아도 되게 하려는 것)
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스에 APK를 올리기 위해
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK
        uses: android-actions/setup-android@v3

      # gradle-wrapper.jar(바이너리)를 저장소에 넣지 않으려고 러너의 gradle을 쓴다
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 파서 단위 테스트
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: 디버그 APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 이름 고정
        run: cp android/app/build/outputs/apk/debug/app-debug.apk guild-overlay-android.apk

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: build-overlay-debug-apk
          path: guild-overlay-android.apk
          if-no-files-found: error

      # 로그인 없이 받을 수 있는 고정 주소를 만든다. 올릴 때마다 이전 파일을 갈아치운다.
      #   https://github.com/ericalapiestral-hash/guild-bot/releases/latest/download/guild-overlay-android.apk
      # PC용 exe는 안 올린다 — 그쪽엔 길드 도감이 들어 있어 공개하면 안 된다.
      - name: 최신 APK 릴리스 갱신
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "최신 APK" \
            --notes "main에 올릴 때마다 자동으로 갱신됩니다. 안드로이드 오버레이 APK만 있습니다 (PC용 exe는 길드 도감이 들어 있어 여기 올리지 않습니다)."
          gh release upload latest guild-overlay-android.apk --clobber

      - name: 테스트 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
